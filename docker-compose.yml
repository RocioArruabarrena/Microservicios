version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservicios-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Servicio de Autenticación
  auth-service:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_minimum_32_characters_long}
      JWT_EXPIRES_IN: 7d
      SERVICE_NAME: auth-service
      API_VERSION: v1
    networks:
      - microservicios-network
    restart: unless-stopped

  # Servicio de Usuarios
  usuario-service:
    build:
      context: ./usuario-service
      dockerfile: Dockerfile
    container_name: usuario-service
    ports:
      - "8001:8001"
    environment:
      NODE_ENV: production
      PORT: 8001
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_minimum_32_characters_long}
      JWT_EXPIRES_IN: 7d
      API_VERSION: v1
      MONGODB_URI: mongodb://mongodb:27017/usuarios
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservicios-network
    restart: unless-stopped

  # Servicio de Pedidos
  pedido-service:
    build:
      context: ./pedido-service
      dockerfile: Dockerfile
    container_name: pedido-service
    ports:
      - "8002:8002"
    environment:
      NODE_ENV: production
      PORT: 8002
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_minimum_32_characters_long}
      JWT_EXPIRES_IN: 7d
      API_VERSION: v1
      USUARIO_SERVICE_URL: http://usuario-service:8001
      MONGODB_URI: mongodb://mongodb:27017/pedidos
    depends_on:
      postgres:
        condition: service_healthy
      usuario-service:
        condition: service_started
      auth-service:
        condition: service_started
    networks:
      - microservicios-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  microservicios-network:
    driver: bridge

